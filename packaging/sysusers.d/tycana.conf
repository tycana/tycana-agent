# The tycanad user: a locked system account with no home and no shell
# (ADR 0009). A static user, not DynamicUser=, because dbus-daemon refuses
# DynamicUser clients ("Transport endpoint is not connected" on Ubuntu
# 24.04, 2026-10-16), and the agent reads unit state from systemd over
# D-Bus. Install to /usr/lib/sysusers.d/tycana.conf.
u tycana - "Tycana host agent (observe-only)" / /usr/sbin/nologin
