version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Writes to stdout/stderr in a CLI; nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - testdata
    rules:
      - path: _test\.go
        linters: [gosec, unparam, prealloc]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - testdata
